  <rect x="48" y="35" width="9" height="5" fill="#6b7378"/>
  <!-- triangular treads -->
  <path d="M3 62 L12 47 L24 47 L29 62 Z" fill="#2f2b27"/>
  <path d="M35 62 L40 47 L52 47 L61 62 Z" fill="#2f2b27"/>
