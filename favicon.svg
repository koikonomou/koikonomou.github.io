    <circle cx="21" cy="10.5" r="1.6" fill="#f7f4ef"/>
  </g>
  <g transform="rotate(14 45 12)">
    <path d="M57 6 Q57 2 52 2 L37 3 Q33 3 33 8 L34 17 Q35 22 42 22 L51 22 Q57 22 57 15 Z" fill="#9aa3a8" stroke="#4f575c" stroke-width="1.5"/>
