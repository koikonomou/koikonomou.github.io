name: Update publications

on:
  schedule:
    - cron: "17 4 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/fetch_publications.py, .github/workflows/update-publications.yml]

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch from OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python3 scripts/fetch_publications.py
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- publications.json && git ls-files --error-unmatch publications.json >/dev/null 2>&1; then
            echo "No changes."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publications.json
          git commit -m "Update publications from OpenAlex"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # Pushes made with GITHUB_TOKEN don't start a Pages build on their own.
      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; the next push will publish it."
